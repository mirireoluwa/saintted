<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The site is dark-only.
      document.documentElement.setAttribute("data-theme", "dark");
    </script>
        <meta name="theme-color" content="#0d0e11" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="A Nigerian artist and producer creating experimental alternative and afrobeats songs. Stream singles, watch official videos, and explore the latest releases."
    />
    <meta name="robots" content="index,follow,max-snippet:220,max-image-preview:large" />
    <!-- Link preview (og:image needs absolute URL — set VITE_SITE_URL in .env for your domain) -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:site_name" content="saintted" />
    <meta property="og:title" content="saintted" />
    <meta
      property="og:description"
      content="A Nigerian artist and producer creating experimental alternative and afrobeats songs. Stream singles, watch official videos, and explore the latest releases."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="768" />

      name="twitter:description"
      content="A Nigerian artist and producer creating experimental alternative and afrobeats songs. Stream singles, watch official videos, and explore the latest releases."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <link rel="preload" href="/fonts/ApfelGrotezk-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ApfelGrotezk-Mittel.woff2" as="font" type="font/woff2" crossorigin />
