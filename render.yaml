# Render Blueprint — Django API (pairs with Supabase Postgres + Storage).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: saintted-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: USE_S3_MEDIA
        value: "1"
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: S3_BUCKET_NAME
        value: media
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
